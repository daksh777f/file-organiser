<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>
  
  <!-- Window Frame -->
  <rect x="50" y="50" width="700" height="300" rx="10" ry="10" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Window Title Bar -->
  <rect x="50" y="50" width="700" height="30" rx="10" ry="10" fill="#e0e0e0"/>
  <text x="70" y="70" font-family="Arial" font-size="14" fill="#333333">Downloads</text>
  
  <!-- File Icons and Names -->
  <!-- Row 1 -->
  <g transform="translate(70, 100)">
    <!-- Document Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#4285f4"/>
    <rect x="10" y="5" width="20" height="25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">report.pdf</text>
  </g>
  
  <g transform="translate(150, 100)">
    <!-- Image Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#0f9d58"/>
    <circle cx="20" cy="20" r="10" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">photo.jpg</text>
  </g>
  
  <g transform="translate(230, 100)">
    <!-- Video Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#db4437"/>
    <polygon points="15,15 30,25 15,35" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">video.mp4</text>
  </g>
  
  <g transform="translate(310, 100)">
    <!-- Archive Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#f4b400"/>
    <rect x="10" y="15" width="20" height="5" fill="#ffffff"/>
    <rect x="10" y="25" width="20" height="5" fill="#ffffff"/>
    <rect x="10" y="35" width="20" height="5" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">data.zip</text>
  </g>
  
  <g transform="translate(390, 100)">
    <!-- Code Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#673ab7"/>
    <text x="20" y="30" font-family="monospace" font-size="14" text-anchor="middle" fill="#ffffff">&lt;/&gt;</text>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">script.py</text>
  </g>
  
  <g transform="translate(470, 100)">
    <!-- Audio Icon -->
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#00bcd4"/>
    <circle cx="15" cy="25" r="5" fill="#ffffff"/>
    <path d="M15,25 L30,25 L30,15 L35,15 L35,35 L30,35 L30,25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">song.mp3</text>
  </g>
  
  <!-- Row 2 -->
  <g transform="translate(70, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#4285f4"/>
    <rect x="10" y="5" width="20" height="25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">notes.txt</text>
  </g>
  
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#0f9d58"/>
    <circle cx="20" cy="20" r="10" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">logo.png</text>
  </g>
  
  <g transform="translate(230, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#db4437"/>
    <polygon points="15,15 30,25 15,35" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">movie.mkv</text>
  </g>
  
  <g transform="translate(310, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#4285f4"/>
    <rect x="10" y="5" width="20" height="25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">resume.docx</text>
  </g>
  
  <g transform="translate(390, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#0f9d58"/>
    <circle cx="20" cy="20" r="10" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">banner.svg</text>
  </g>
  
  <g transform="translate(470, 180)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#9e9e9e"/>
    <text x="20" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">?</text>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">unknown.bin</text>
  </g>
  
  <!-- Row 3 -->
  <g transform="translate(70, 260)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#4285f4"/>
    <rect x="10" y="5" width="20" height="25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">invoice.pdf</text>
  </g>
  
  <g transform="translate(150, 260)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#673ab7"/>
    <text x="20" y="30" font-family="monospace" font-size="14" text-anchor="middle" fill="#ffffff">&lt;/&gt;</text>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">index.html</text>
  </g>
  
  <g transform="translate(230, 260)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#00bcd4"/>
    <circle cx="15" cy="25" r="5" fill="#ffffff"/>
    <path d="M15,25 L30,25 L30,15 L35,15 L35,35 L30,35 L30,25" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">podcast.wav</text>
  </g>
  
  <g transform="translate(310, 260)">
    <rect x="0" y="0" width="40" height="50" rx="3" ry="3" fill="#f4b400"/>
    <rect x="10" y="15" width="20" height="5" fill="#ffffff"/>
    <rect x="10" y="25" width="20" height="5" fill="#ffffff"/>
    <rect x="10" y="35" width="20" height="5" fill="#ffffff"/>
    <text x="20" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333333">backup.rar</text>
  </g>
</svg>