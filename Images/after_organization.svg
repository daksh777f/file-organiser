<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>
  
  <!-- Window Frame -->
  <rect x="50" y="50" width="700" height="300" rx="10" ry="10" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Window Title Bar -->
  <rect x="50" y="50" width="700" height="30" rx="10" ry="10" fill="#e0e0e0"/>
  <text x="70" y="70" font-family="Arial" font-size="14" fill="#333333">Downloads (Organized)</text>
  
  <!-- Folder Icons and Names -->
  <g transform="translate(70, 120)">
    <!-- Documents Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#4285f4"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#4285f4"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Documents</text>
  </g>
  
  <g transform="translate(170, 120)">
    <!-- Images Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#0f9d58"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#0f9d58"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Images</text>
  </g>
  
  <g transform="translate(270, 120)">
    <!-- Videos Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#db4437"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#db4437"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Videos</text>
  </g>
  
  <g transform="translate(370, 120)">
    <!-- Audio Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#00bcd4"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#00bcd4"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Audio</text>
  </g>
  
  <g transform="translate(470, 120)">
    <!-- Archives Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#f4b400"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#f4b400"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Archives</text>
  </g>
  
  <g transform="translate(570, 120)">
    <!-- Code Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#673ab7"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#673ab7"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Code</text>
  </g>
  
  <g transform="translate(70, 220)">
    <!-- Others Folder -->
    <rect x="0" y="0" width="60" height="50" rx="5" ry="5" fill="#9e9e9e"/>
    <path d="M0,10 L20,10 L30,0 L60,0 L60,50 L0,50 Z" fill="#9e9e9e"/>
    <text x="30" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Others</text>
  </g>
  
  <!-- Documents Folder Contents (Expanded View) -->
  <g transform="translate(170, 220)">
    <rect x="0" y="0" width="500" height="100" rx="5" ry="5" fill="#e3f2fd" stroke="#bbdefb" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial" font-size="12" fill="#333333">Documents Folder Contents:</text>
    
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="20" height="25" rx="2" ry="2" fill="#4285f4"/>
      <rect x="5" y="2" width="10" height="12" fill="#ffffff"/>
      <text x="25" y="15" font-family="Arial" font-size="10" fill="#333333">report.pdf</text>
    </g>
    
    <g transform="translate(120, 30)">
      <rect x="0" y="0" width="20" height="25" rx="2" ry="2" fill="#4285f4"/>
      <rect x="5" y="2" width="10" height="12" fill="#ffffff"/>
      <text x="25" y="15" font-family="Arial" font-size="10" fill="#333333">notes.txt</text>
    </g>
    
    <g transform="translate(220, 30)">
      <rect x="0" y="0" width="20" height="25" rx="2" ry="2" fill="#4285f4"/>
      <rect x="5" y="2" width="10" height="12" fill="#ffffff"/>
      <text x="25" y="15" font-family="Arial" font-size="10" fill="#333333">resume.docx</text>
    </g>
    
    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="20" height="25" rx="2" ry="2" fill="#4285f4"/>
      <rect x="5" y="2" width="10" height="12" fill="#ffffff"/>
      <text x="25" y="15" font-family="Arial" font-size="10" fill="#333333">invoice.pdf</text>
    </g>
    
    <text x="10" y="75" font-family="Arial" font-size="10" fill="#666666">All documents are now organized in one place</text>
  </g>
  
  <!-- Organization Statistics -->
  <g transform="translate(600, 180)">
    <rect x="0" y="0" width="120" height="140" rx="5" ry="5" fill="#f0f0f0" stroke="#dddddd" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial" font-size="10" font-weight="bold" fill="#333333">Statistics:</text>
    <text x="10" y="40" font-family="Arial" font-size="9" fill="#333333">Documents: 4</text>
    <text x="10" y="55" font-family="Arial" font-size="9" fill="#333333">Images: 3</text>
    <text x="10" y="70" font-family="Arial" font-size="9" fill="#333333">Videos: 2</text>
    <text x="10" y="85" font-family="Arial" font-size="9" fill="#333333">Audio: 2</text>
    <text x="10" y="100" font-family="Arial" font-size="9" fill="#333333">Archives: 2</text>
    <text x="10" y="115" font-family="Arial" font-size="9" fill="#333333">Code: 2</text>
    <text x="10" y="130" font-family="Arial" font-size="9" fill="#333333">Others: 1</text>
  </g>
</svg>