{% extends "base.html" %}

{% block title %}Error {{ error_code }} - File Organizer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Error {{ error_code }}</h4>
            </div>
            <div class="card-body text-center py-5">
                <div class="mb-4">
                    <i class="bi bi-emoji-frown display-1 text-muted"></i>
                </div>
                <h2 class="mb-3">Oops! Something went wrong</h2>
                <p class="lead mb-4">{{ error_message }}</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house me-2"></i>Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
